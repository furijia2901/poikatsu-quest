name: Restore regression tests
on:
  push:
    branches: [v8-local-restore, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check backup-preview-v8.js
      - run: node tests/restore-v8.test.cjs
