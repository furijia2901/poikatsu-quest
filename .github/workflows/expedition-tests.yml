name: Star Expedition tests
on:
  push:
    branches: [v9-star-expedition, v92-ui-reorganization, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check expedition90.js
      - run: node --check ui92.js
      - run: node tests/ui92.test.cjs
      - run: node tests/expedition90.test.cjs
      - run: node tests/diagnostics-release.test.cjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/expedition90.browser.cjs

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/expedition90.db.sh
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
