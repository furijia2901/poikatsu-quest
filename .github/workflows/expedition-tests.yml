name: Star Expedition tests
on:
  push:
    branches: [v9-star-expedition, v92-ui-reorganization, v10-star-explorer, v105-game-experience, v11-town-revolution, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check expedition90.js
      - run: node --check ui92.js
      - run: node --check game105.js
      - run: node --check town110.js
      - run: node --check district110.js
      - run: node --check residents110.js
      - run: node --check production110.js
      - run: node tests/production110.test.cjs
      - run: node tests/residents110.test.cjs
      - run: node tests/district110.test.cjs
      - run: node tests/town110.test.cjs
      - run: node --check profile105.js
      - run: node --check collection105.js
      - run: node --check inbox105.js
      - run: node --check audio105.js
      - run: node --check testcenter105.js
      - run: node tests/testcenter105.test.cjs
      - run: node tests/audio105.test.cjs
      - run: node tests/inbox105.test.cjs
      - run: node tests/collection105.test.cjs
      - run: node tests/profile105.test.cjs
      - run: node tests/game105.test.cjs
      - run: node tests/ui92.test.cjs
      - run: node tests/expedition90.test.cjs
      - run: node tests/explorer10.test.cjs
      - run: node tests/diagnostics-release.test.cjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/expedition90.browser.cjs

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/expedition90.db.sh
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
